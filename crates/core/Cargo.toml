[package]
name = "hetianxia-core"
version = "1.0.0"
edition = "2021"
description = "合天下核心：扫描、合并、执行、备份与回滚"
license = "MIT"
autobins = false

[features]
default = []
# 故障注入只在显式打开时编译进二进制。正式包不要带这个 feature。
fault-inject = []

[dependencies]
serde = { version = "=1.0.214", features = ["derive"] }
serde_json = "=1.0.132"
thiserror = "=1.0.69"
xxhash-rust = { version = "=0.8.12", features = ["xxh3"] }
sha2 = "=0.10.8"
hex = "=0.4.3"
similar = "=2.6.0"
encoding_rs = "=0.8.35"
chardetng = "=0.1.17"
zip = { version = "=2.6.1", default-features = false, features = ["deflate"] }
unicode-normalization = "=0.1.24"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
uuid = { version = "=1.11.0", features = ["v4", "serde"] }
chrono = { version = "=0.4.38", features = ["serde"] }
walkdir = "=2.5.0"
filetime = "=0.2.25"
libc = "=0.2.161"
fs4 = "=0.8.4"
zeroize = { version = "=1.8.1", features = ["derive"] }
# 下面几个是传递依赖，钉死版本，避免在 Rust 1.83 上拉到 edition2024 的新发布。
indexmap = "=2.6.0"
hashbrown = "=0.15.2"
zeroize_derive = "=1.4.2"
zopfli = "=0.8.1"
# filetime 在 redox 目标上依赖 libredox。0.9.x 的清单用了 resolver 3，Rust 1.83 读不了。
libredox = "=0.1.17"
redox_syscall = "=0.8.1"

[dev-dependencies]
proptest = "=1.5.0"
tempfile = "=3.14.0"

[[bin]]
name = "hetianxia-linkcheck"
path = "src/bin/linkcheck.rs"

[[bin]]
name = "fault-check"
path = "src/bin/fault_check.rs"
required-features = ["fault-inject"]
